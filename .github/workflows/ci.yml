name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Lint & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: "Installation (sans PyTorch : les tests utilisent des modèles factices)"
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: |
          ruff check . ../frontend ../eval
          ruff format --check . ../frontend ../eval
      - name: Pytest
        run: python -m pytest -v

  docker:
    name: Build des images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validation de docker-compose.yml
        run: cp .env.example .env && docker compose config --quiet
      - name: Build backend
        run: docker build -t rag-ecole-backend ./backend
      - name: Build frontend
        run: docker build -t rag-ecole-frontend ./frontend
